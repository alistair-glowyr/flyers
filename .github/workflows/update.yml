name: Update and deploy grocery deals

on:
  push:
    branches: [main]
  schedule:
    # Thursday at 12:00 UTC (8am Toronto during daylight-saving time).
    - cron: "0 12 * * 4"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Run regression tests
        run: python tests/test_normalize.py

      - name: Fetch this week's flyers
        run: python scripts/fetch_flyers.py

      - name: Build static site
        run: python scripts/build_site.py

      - name: Commit refreshed data
        run: |
          if git diff --quiet -- data docs; then
            echo "No generated changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data docs
          git commit -m "Refresh weekly flyer data"
          git push

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
